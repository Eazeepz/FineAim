[mod]
name = Fine Aim
author = hermes
version = 1.2
description = Hold right mouse to aim down sights: the gun comes up, the camera moves over the shoulder, and accuracy depends on how you stand and move.\nMelee moves to X. Camera presets are in presets.ini.

[settings]
; ---------------------------------------------------------------------------
; Keys
; ---------------------------------------------------------------------------
; Aim key as a key code: 2 = right mouse, 1 = left mouse, 3 = middle mouse.
aim_key = 2
; Melee moves off right mouse onto this key (on foot, with a gun). 0 = leave melee alone.
remap_melee = 1
melee_key = X
; Caps Lock toggles slow walk on and off, aiming or not (20 = Caps Lock). 0 = no toggle.
walk_toggle_key = 20
; 1 = start the game in slow walk.
walk_start = 0

; ---------------------------------------------------------------------------
; Camera
; ---------------------------------------------------------------------------
; Starting camera preset, by name from presets.ini or my_presets.ini.
preset = SR1
; How fast the camera moves in when you aim. Higher is snappier.
aim_speed = 8.0
; How fast it moves back out, as a multiple of aim_speed. 0 = same as aim_speed.
aim_return = 0.0
; How far the camera drops when you crouch. 1.0 = the game's own crouch drop.
crouch_scale = 1.25
; 1 = crouch works while moving (the game only lets you crouch standing still).
crouch_while_moving = 1
; Your crouch key, so the mod can see the press (C is the game's crouch key).
crouch_key = C

; Live tuning while you play. Hold a key to change the active camera; the result
; is saved to camera.cfg and comes back next time. Keys can be any key name,
; optionally with CTRL+, ALT+ or SHIFT+. Leave a key empty to turn it off.
tune_keys = 1
tune_step = 0.25
key_zoom_in = MINUS
key_zoom_out = PLUS
key_fov_wide = PAGEUP
key_fov_narrow = PAGEDOWN
key_height_down = HOME
key_height_up = END
key_shoulder_left = CTRL+I
key_shoulder_right = CTRL+O
; Back to the preset's own values / previous preset / next preset.
key_preset_reset = CTRL+J
key_preset_prev = CTRL+K
key_preset_next = CTRL+Y
; Save the current camera as a preset in my_presets.ini / delete a saved one.
key_preset_save = CTRL+U
key_preset_clear = CTRL+G

; ---------------------------------------------------------------------------
; Movement while aiming
; ---------------------------------------------------------------------------
; 1 = aiming uses the game's own aim mode (camera_first_mode): slow walk,
; shouldered rifles and shotguns, strafing. 0 = off.
first_person_moves = 1
; Without the walk toggle key: 1 = walk slowly while aiming, 0 = keep your speed.
slow_walk = 1
; Speed while aiming in slow walk. 1.0 = the game's slow walk, 1.8 = about a jog.
aim_walk_speed = 1.8
; When you sprint and then aim, wait this many frames for the sprint to end
; before raising the gun, so the arms blend up. 0 = raise at once.
raise_after_sprint = 1
raise_wait_frames = 20
; While firing from the hip (and this many ms after), face where you shoot.
; 0 = off.
hip_face_ms = 600
; How long one raise call holds the gun up, in ms. Only needs to be longer
; than one frame.
raise_hold_ms = 500
; Frames with a frozen game clock that count as a pause menu.
pause_frames = 3

; ---------------------------------------------------------------------------
; Accuracy
; ---------------------------------------------------------------------------
; 1 = Fine Aim sets the cone from what you are doing. Each number multiplies the
; weapon's own cone, so every gun keeps its character. Smaller = more accurate.
; 0 = the game's own accuracy.
cone_model = 1
;                         hip     aimed
; standing still          1.00    0.40
; crouching still         0.80    0.30
; moving                  1.60    0.70
; crouch-moving           1.30    0.55
; slow-walking            1.25    0.55
; crouch slow-walking     1.05    0.45
; sprinting               2.00    --
cone_stand_hip = 1.00
cone_stand_ads = 0.40
cone_crouch_hip = 0.80
cone_crouch_ads = 0.30
cone_move_hip = 1.60
cone_move_ads = 0.70
cone_crouch_move_hip = 1.30
cone_crouch_move_ads = 0.55
cone_slowwalk_hip = 1.25
cone_slowwalk_ads = 0.55
cone_crouch_slowwalk_hip = 1.05
cone_crouch_slowwalk_ads = 0.45
cone_sprint = 2.00
; Faster than this (metres a second) counts as moving.
moving_speed = 0.6

; ---------------------------------------------------------------------------
; Vehicles
; ---------------------------------------------------------------------------
; Right mouse in a vehicle raises the gun for a drive-by. While it is up the
; view zooms in a little and shots tighten. The camera itself does not move.
; Field of view while aiming from a vehicle. 1.0 = no zoom.
vehicle_fov = 0.85
; Drive-by cone, same scale as above. 2.00 matches the game's own drive-by spread.
cone_vehicle_hip = 2.00
cone_vehicle_ads = 1.00

; ---------------------------------------------------------------------------
; Crosshair
; ---------------------------------------------------------------------------
; 1 = the crosshair shows your accuracy: it shrinks when you crouch or aim and
; grows when you move, using the cone numbers above. Guns only.
; 0 = it only shrinks while aiming, to aim_reticle_scale.
reticle_follows_cone = 1
; How much of the cone's change the crosshair shows. Growing is toned down so
; the crosshair stays readable while running: 0.4 = a 2.0 sprint cone draws the
; crosshair at 1.4x. Shrinking: 1.0 = the full change (0.40 cone = 0.40 size).
reticle_grow = 0.4
reticle_shrink = 1.0
; Aimed crosshair size when reticle_follows_cone = 0. 1.0 = unchanged.
aim_reticle_scale = 0.6
